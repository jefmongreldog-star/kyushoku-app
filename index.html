<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きょう、どこで食べる？</title>
<style>
  :root {
    --bg: #FBF7F0;
    --ink: #2E2A24;
    --sub: #8A8275;
    --line: #E7DFD0;
    --card: #FFFFFF;
    --accent: #C7622A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px 16px 60px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    padding: 18px 4px 22px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.02em; }
  header p { margin: 0; color: var(--sub); font-size: 13px; }
  #dateLabel { font-weight: 600; color: var(--accent); }

  section { margin-bottom: 28px; }
  h2 { font-size: 14px; color: var(--sub); margin: 0 0 10px; font-weight: 600; }

  #board { display: flex; flex-direction: column; gap: 4px; }
  .boardGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 6px; }
  .divisionHeading {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    padding: 10px 2px 4px;
    border-top: 1px solid var(--line);
    margin-top: 4px;
  }
  .divisionHeading:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  .unplacedTray {
    background: repeating-linear-gradient(45deg, #FFF6E5, #FFF6E5 10px, #FDEFD4 10px, #FDEFD4 20px);
    border: 2px dashed #D9A441;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .unplacedTray .placeName {
    font-size: 12px;
    color: #9C6B12;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .unplacedTray .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .unplacedTray .tag {
    background: #FFFFFF;
    border: 1px solid #E8C27A;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #7A5510;
  }
  .place {
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    border-left: 4px solid var(--c);
    min-height: 58px;
  }
  .place .placeName { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .place .people { font-size: 14px; line-height: 1.7; word-break: break-all; }
  .place .people.empty { color: #C9C2B4; }

  #staffList, #placeList {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .rowLabel { font-size: 15px; font-weight: 600; flex-shrink: 0; }
  .rowMain { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--c); }

  .statusSelect, .textInput {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 14px;
    color: var(--ink);
  }
  .statusSelect { flex: 1; max-width: 150px; }
  .defaultSelect { flex: 1; max-width: 150px; font-size: 12px; color: var(--sub); }
  .textInput { flex: 1; min-width: 0; }
  .selectGroup { display: flex; flex-direction: column; gap: 2px; flex: 1; max-width: 150px; }
  .selectLabel { font-size: 10px; color: var(--sub); }
  .row { flex-wrap: wrap; }

  .iconBtn {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 8px;
    flex-shrink: 0;
  }
  .iconBtn:hover { color: var(--accent); }
  .iconBtn.danger:hover { color: #B23A3A; }

  #addForm, #addPlaceForm { display: flex; gap: 8px; margin-top: 12px; }
  .textInput.grow { flex: 1; padding: 10px 12px; }
  .primaryBtn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .primaryBtn:active { opacity: 0.8; }

  #status { text-align: center; color: var(--sub); font-size: 12px; margin-top: 24px; }

  .refreshBtn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--sub);
    cursor: pointer;
  }
  .headRow { display: flex; justify-content: space-between; align-items: center; }

  details#placeManager { margin-top: 8px; }
  details#placeManager summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 0;
  }
</style>
</head>
<body>

<header>
  <h1>きょう、どこで食べる？</h1>
  <p><span id="dateLabel"></span>の給食の場所</p>
</header>

<section>
  <div class="headRow">
    <h2>一覧</h2>
    <button class="refreshBtn" id="refreshBtn">更新</button>
  </div>
  <div id="board"></div>
</section>

<section>
  <h2>自分の場所を選ぶ</h2>
  <div id="staffList"></div>
  <form id="addForm">
    <input type="text" id="newName" class="textInput grow" placeholder="名前を追加（例：田中）" required>
    <button type="submit" class="primaryBtn">追加</button>
  </form>
</section>

<section>
  <details id="placeManager">
    <summary>食べる場所を編集する</summary>
    <div id="placeList" style="margin-top:10px;"></div>
    <form id="addPlaceForm">
      <input type="text" id="newPlace" class="textInput grow" placeholder="場所を追加（例：図書室）" required>
      <select id="newPlaceDivision" class="statusSelect">
        <option value="小学部">小学部</option>
        <option value="中学部">中学部</option>
        <option value="共通">共通</option>
      </select>
      <button type="submit" class="primaryBtn">追加</button>
    </form>
  </details>
</section>

<div id="status"></div>

<script>
  // ==== Firebase REST API 設定 ====
  const DATABASE_URL = "https://kyushoku-app-default-rtdb.asia-southeast1.firebasedatabase.app";

  const DEFAULT_PLACES = [
    { name: "1年", division: "小学部" },
    { name: "2年", division: "小学部" },
    { name: "3年", division: "小学部" },
    { name: "4年", division: "小学部" },
    { name: "5年", division: "小学部" },
    { name: "6年", division: "小学部" },
    { name: "職員室", division: "共通" },
    { name: "食べない", division: "共通" }
  ];
  const DIVISIONS = ["小学部", "中学部", "共通"];
  const COLOR_PALETTE = ["#E8B23E", "#7FA36E", "#4E8C9C", "#7C6FA8", "#C2588A", "#B75A3A", "#5C6B73", "#B0A99A", "#9C8AA5", "#5E9E7E"];

  function colorFor(index) {
    return COLOR_PALETTE[index % COLOR_PALETTE.length];
  }

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function todayLabel() {
    const d = new Date();
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  }

  document.getElementById("dateLabel").textContent = todayLabel();

  let staff = {};     // { id: { name, defaultPlace } }
  let places = {};    // { id: { name } }
  let statuses = {};  // { staffId: placeId }

  async function fetchStaff() {
    const res = await fetch(`${DATABASE_URL}/staff.json`);
    staff = (await res.json()) || {};
  }

  async function fetchPlaces() {
    const res = await fetch(`${DATABASE_URL}/places.json`);
    let data = await res.json();
    if (!data) {
      // 初回だけ、既定の場所を作成しておく
      data = {};
      for (const p of DEFAULT_PLACES) {
        const r = await fetch(`${DATABASE_URL}/places.json`, {
          method: "POST",
          body: JSON.stringify({ name: p.name, division: p.division })
        });
        const created = await r.json();
        data[created.name] = { name: p.name, division: p.division };
      }
    }
    places = data;
  }

  async function fetchStatuses() {
    const res = await fetch(`${DATABASE_URL}/statuses/${todayKey()}.json`);
    statuses = (await res.json()) || {};
  }

  function placeIdsSorted() {
    return Object.keys(places);
  }

  async function ensureDefaults() {
    for (const id of Object.keys(staff)) {
      if (!statuses[id] && staff[id].defaultPlace && places[staff[id].defaultPlace]) {
        await setStatus(id, staff[id].defaultPlace);
      }
    }
  }

  async function setStatus(staffId, placeId) {
    await fetch(`${DATABASE_URL}/statuses/${todayKey()}/${staffId}.json`, {
      method: "PUT",
      body: JSON.stringify(placeId)
    });
    statuses[staffId] = placeId;
    renderBoard();
  }

  async function addStaff(name) {
    const res = await fetch(`${DATABASE_URL}/staff.json`, {
      method: "POST",
      body: JSON.stringify({ name, defaultPlace: null })
    });
    const data = await res.json();
    staff[data.name] = { name, defaultPlace: null };
  }

  async function renameStaff(id, newName) {
    await fetch(`${DATABASE_URL}/staff/${id}.json`, {
      method: "PATCH",
      body: JSON.stringify({ name: newName })
    });
    staff[id].name = newName;
  }

  async function setDefaultPlace(id, placeId) {
    await fetch(`${DATABASE_URL}/staff/${id}.json`, {
      method: "PATCH",
      body: JSON.stringify({ defaultPlace: placeId })
    });
    staff[id].defaultPlace = placeId;
  }

  async function deleteStaff(id) {
    await fetch(`${DATABASE_URL}/staff/${id}.json`, { method: "DELETE" });
    delete staff[id];
  }

  async function addPlace(name, division) {
    const res = await fetch(`${DATABASE_URL}/places.json`, {
      method: "POST",
      body: JSON.stringify({ name, division })
    });
    const data = await res.json();
    places[data.name] = { name, division };
  }

  async function renamePlace(id, newName) {
    await fetch(`${DATABASE_URL}/places/${id}.json`, {
      method: "PATCH",
      body: JSON.stringify({ name: newName })
    });
    places[id].name = newName;
  }

  async function setPlaceDivision(id, division) {
    await fetch(`${DATABASE_URL}/places/${id}.json`, {
      method: "PATCH",
      body: JSON.stringify({ division })
    });
    places[id].division = division;
  }

  async function deletePlace(id) {
    await fetch(`${DATABASE_URL}/places/${id}.json`, { method: "DELETE" });
    delete places[id];
  }

  function renderBoard() {
    const board = document.getElementById("board");
    board.innerHTML = "";

    const unplacedNames = Object.keys(staff)
      .filter(sid => !statuses[sid])
      .map(sid => staff[sid].name);

    if (unplacedNames.length > 0) {
      const tray = document.createElement("div");
      tray.className = "unplacedTray";
      tray.innerHTML = `
        <div class="placeName">まだ選んでいない（${unplacedNames.length}人）</div>
        <div class="tags">
          ${unplacedNames.map(n => `<span class="tag">${n}</span>`).join("")}
        </div>
      `;
      board.appendChild(tray);
    }

    const ids = placeIdsSorted();

    const groups = {};
    DIVISIONS.forEach(d => groups[d] = []);
    ids.forEach((pid, i) => {
      const div = places[pid].division || "共通";
      if (!groups[div]) groups[div] = [];
      groups[div].push({ pid, colorIndex: i });
    });

    DIVISIONS.forEach(divisionName => {
      const group = groups[divisionName];
      if (!group || group.length === 0) return;

      const heading = document.createElement("div");
      heading.className = "divisionHeading";
      heading.textContent = divisionName;
      board.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "boardGrid";
      group.forEach(({ pid, colorIndex }) => {
        const namesHere = Object.keys(staff)
          .filter(sid => statuses[sid] === pid)
          .map(sid => staff[sid].name);

        const div = document.createElement("div");
        div.className = "place";
        div.style.setProperty("--c", colorFor(colorIndex));
        div.innerHTML = `
          <div class="placeName">${places[pid].name}</div>
          <div class="people ${namesHere.length ? "" : "empty"}">
            ${namesHere.length ? namesHere.join("、") : "―"}
          </div>
        `;
        grid.appendChild(div);
      });
      board.appendChild(grid);
    });
  }

  function renderStaffList() {
    const list = document.getElementById("staffList");
    list.innerHTML = "";
    const ids = Object.keys(staff).sort((a, b) =>
      (staff[a].name || "").localeCompare(staff[b].name || "", "ja")
    );

    if (ids.length === 0) {
      list.innerHTML = `<div class="row"><span class="rowLabel" style="color:var(--sub);">まだ誰も登録されていません</span></div>`;
      return;
    }

    const placeIds = placeIdsSorted();

    function groupedOptions(selectedId, placeholderLabel) {
      let html = `<option value="">${placeholderLabel}</option>`;
      DIVISIONS.forEach(divisionName => {
        const idsInDiv = placeIds.filter(pid => (places[pid].division || "共通") === divisionName);
        if (idsInDiv.length === 0) return;
        html += `<optgroup label="${divisionName}">`;
        idsInDiv.forEach(pid => {
          html += `<option value="${pid}" ${selectedId === pid ? "selected" : ""}>${places[pid].name}</option>`;
        });
        html += `</optgroup>`;
      });
      return html;
    }

    ids.forEach(id => {
      const row = document.createElement("div");
      row.className = "row";
      const current = statuses[id] || "";

      const options = groupedOptions(current, "－未選択－");
      const defaultOptions = groupedOptions(staff[id].defaultPlace, "－なし－");

      row.innerHTML = `
        <div class="rowMain">
          <span class="rowLabel" data-view="${id}">${staff[id].name}</span>
        </div>
        <div class="selectGroup">
          <span class="selectLabel">今日</span>
          <select class="statusSelect" data-id="${id}">${options}</select>
        </div>
        <div class="selectGroup">
          <span class="selectLabel">基本の場所</span>
          <select class="defaultSelect" data-default-id="${id}">${defaultOptions}</select>
        </div>
        <button class="iconBtn" data-edit-staff="${id}">名前変更</button>
        <button class="iconBtn danger" data-del-staff="${id}">削除</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll(".statusSelect").forEach(sel => {
      sel.addEventListener("change", async (e) => {
        const id = e.target.getAttribute("data-id");
        const val = e.target.value;
        setStatusUI("更新中…");
        await setStatus(id, val);
        setStatusUI("");
      });
    });

    list.querySelectorAll(".defaultSelect").forEach(sel => {
      sel.addEventListener("change", async (e) => {
        const id = e.target.getAttribute("data-default-id");
        const val = e.target.value;
        setStatusUI("保存中…");
        await setDefaultPlace(id, val);
        setStatusUI("");
      });
    });

    list.querySelectorAll("[data-edit-staff]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-edit-staff");
        const label = list.querySelector(`[data-view="${id}"]`);
        const currentName = staff[id].name;
        label.outerHTML = `
          <span class="rowMain">
            <input type="text" class="textInput" value="${currentName}" data-editing="${id}">
          </span>
        `;
        const input = list.querySelector(`[data-editing="${id}"]`);
        input.focus();
        input.select();
        const commit = async () => {
          const val = input.value.trim();
          if (val && val !== currentName) {
            setStatusUI("保存中…");
            await renameStaff(id, val);
            setStatusUI("");
          }
          renderStaffList();
          renderBoard();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commit();
          if (e.key === "Escape") renderStaffList();
        });
        input.addEventListener("blur", commit);
      });
    });

    list.querySelectorAll("[data-del-staff]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-del-staff");
        if (!confirm(`「${staff[id].name}」を削除しますか？`)) return;
        setStatusUI("削除中…");
        await deleteStaff(id);
        renderStaffList();
        renderBoard();
        setStatusUI("");
      });
    });
  }

  function renderPlaceList() {
    const list = document.getElementById("placeList");
    list.innerHTML = "";
    const ids = placeIdsSorted();

    if (ids.length === 0) {
      list.innerHTML = `<div class="row"><span class="rowLabel" style="color:var(--sub);">場所がありません</span></div>`;
      return;
    }

    ids.forEach((id, i) => {
      const row = document.createElement("div");
      row.className = "row";
      const div = places[id].division || "共通";
      const divOptions = DIVISIONS.map(d =>
        `<option value="${d}" ${div === d ? "selected" : ""}>${d}</option>`
      ).join("");
      row.innerHTML = `
        <div class="rowMain">
          <span class="swatch" style="--c:${colorFor(i)}"></span>
          <span class="rowLabel" data-view-place="${id}">${places[id].name}</span>
        </div>
        <select class="statusSelect" data-division-id="${id}">${divOptions}</select>
        <button class="iconBtn" data-edit-place="${id}">名前変更</button>
        <button class="iconBtn danger" data-del-place="${id}">削除</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll("[data-division-id]").forEach(sel => {
      sel.addEventListener("change", async (e) => {
        const id = e.target.getAttribute("data-division-id");
        setStatusUI("保存中…");
        await setPlaceDivision(id, e.target.value);
        setStatusUI("");
        renderBoard();
      });
    });

    list.querySelectorAll("[data-edit-place]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-edit-place");
        const label = list.querySelector(`[data-view-place="${id}"]`);
        const currentName = places[id].name;
        label.outerHTML = `<input type="text" class="textInput" value="${currentName}" data-editing-place="${id}">`;
        const input = list.querySelector(`[data-editing-place="${id}"]`);
        input.focus();
        input.select();
        const commit = async () => {
          const val = input.value.trim();
          if (val && val !== currentName) {
            setStatusUI("保存中…");
            await renamePlace(id, val);
            setStatusUI("");
          }
          renderPlaceList();
          renderBoard();
          renderStaffList();
        };
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commit();
          if (e.key === "Escape") renderPlaceList();
        });
        input.addEventListener("blur", commit);
      });
    });

    list.querySelectorAll("[data-del-place]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-del-place");
        if (!confirm(`「${places[id].name}」を削除しますか？（この場所を選んでいる人は未選択に戻ります）`)) return;
        setStatusUI("削除中…");
        await deletePlace(id);
        renderPlaceList();
        renderBoard();
        renderStaffList();
        setStatusUI("");
      });
    });
  }

  function setStatusUI(text) {
    document.getElementById("status").textContent = text;
  }

  async function loadAll() {
    setStatusUI("読み込み中…");
    await fetchPlaces();
    await fetchStaff();
    await fetchStatuses();
    await ensureDefaults();
    renderBoard();
    renderStaffList();
    renderPlaceList();
    setStatusUI("");
  }

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("newName");
    const name = input.value.trim();
    if (!name) return;
    setStatusUI("追加中…");
    await addStaff(name);
    input.value = "";
    renderStaffList();
    renderBoard();
    setStatusUI("");
  });

  document.getElementById("addPlaceForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("newPlace");
    const divisionSelect = document.getElementById("newPlaceDivision");
    const name = input.value.trim();
    if (!name) return;
    setStatusUI("追加中…");
    await addPlace(name, divisionSelect.value);
    input.value = "";
    renderPlaceList();
    renderBoard();
    renderStaffList();
    setStatusUI("");
  });

  document.getElementById("refreshBtn").addEventListener("click", loadAll);

  loadAll();
  setInterval(loadAll, 8000); // 8秒ごとに自動更新
</script>

</body>
</html>
